<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Listings — RentARoom Buea</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --green: #1a6b3c;
      --green-light: #e8f5ee;
      --yellow: #f5c518;
      --dark: #111;
      --gray: #666;
      --card-border: #e0e0e0;
      --red: #dc3545;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: #f9f9f6; color: var(--dark); }

    nav {
      background: var(--green); padding: 1rem 2rem;
      display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 100;
    }
    .nav-logo {
      font-family: 'Syne', sans-serif; font-weight: 800;
      font-size: 1.4rem; color: #fff; text-decoration: none;
    }
    .nav-logo span { color: var(--yellow); }
    .nav-toggle {
      display: none; background: none; border: none;
      color: #fff; font-size: 1.6rem; cursor: pointer;
    }
    .nav-links { display: flex; align-items: center; gap: 0.5rem; }
    .nav-links a {
      color: #fff; text-decoration: none;
      margin-left: 1rem; font-size: 0.95rem; opacity: 0.85;
    }
    .nav-links a:hover { opacity: 1; }
    .btn-post {
      background: var(--yellow); color: var(--dark) !important;
      padding: 0.4rem 1rem; border-radius: 20px;
      font-weight: 500; opacity: 1 !important;
    }

    .page-wrap { max-width: 900px; margin: 2.5rem auto; padding: 0 1.5rem; }

    .page-header {
      display: flex; justify-content: space-between;
      align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;
    }
    .page-title {
      font-family: 'Syne', sans-serif;
      font-size: 2rem; font-weight: 800;
    }
    .page-subtitle { color: var(--gray); font-size: 0.9rem; margin-top: 0.2rem; }

    .btn-new {
      background: var(--green); color: #fff;
      text-decoration: none; border-radius: 8px;
      padding: 0.6rem 1.4rem;
      font-family: 'Syne', sans-serif;
      font-size: 0.95rem; font-weight: 700;
      transition: background 0.2s;
    }
    .btn-new:hover { background: #145230; }

    /* LISTING CARD */
    .listing-card {
      background: #fff; border: 1px solid var(--card-border);
      border-radius: 14px; overflow: hidden;
      display: flex; gap: 0; margin-bottom: 1.2rem;
      transition: box-shadow 0.2s;
    }
    .listing-card:hover { box-shadow: 0 6px 24px rgba(0,0,0,0.07); }

    .card-thumb {
      width: 160px; min-height: 140px; flex-shrink: 0;
      background: var(--green-light);
      display: flex; align-items: center;
      justify-content: center; font-size: 3rem;
      overflow: hidden;
    }
    .card-thumb img {
      width: 100%; height: 100%; object-fit: cover;
    }

    .card-body {
      flex: 1; padding: 1.2rem 1.5rem;
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .card-top { margin-bottom: 0.8rem; }
    .card-neighborhood {
      font-size: 0.75rem; color: var(--green);
      font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.05em; margin-bottom: 0.3rem;
    }
    .card-title {
      font-family: 'Syne', sans-serif;
      font-size: 1.1rem; font-weight: 800; margin-bottom: 0.2rem;
    }
    .card-type { font-size: 0.85rem; color: var(--gray); }

    .card-meta {
      display: flex; gap: 0.5rem; flex-wrap: wrap;
      margin-top: 0.6rem;
    }
    .amenity-tag {
      background: var(--green-light); color: var(--green);
      font-size: 0.75rem; padding: 0.2rem 0.6rem;
      border-radius: 20px; font-weight: 500;
    }

    .card-footer {
      display: flex; justify-content: space-between;
      align-items: center; flex-wrap: wrap; gap: 0.8rem;
    }
    .card-price {
      font-family: 'Syne', sans-serif;
      font-size: 1.15rem; font-weight: 800;
    }
    .card-price span {
      font-size: 0.78rem; color: var(--gray);
      font-family: 'DM Sans', sans-serif; font-weight: 400;
    }

    .card-actions { display: flex; gap: 0.6rem; }
    .btn-edit {
      background: var(--green); color: #fff;
      border: none; border-radius: 7px;
      padding: 0.45rem 1rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem; cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn-edit:hover { background: #145230; }
    .btn-delete {
      background: none; color: var(--red);
      border: 1.5px solid var(--red); border-radius: 7px;
      padding: 0.45rem 1rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem; cursor: pointer;
      transition: all 0.2s;
    }
    .btn-delete:hover { background: var(--red); color: #fff; }

    .empty-state {
      text-align: center; padding: 5rem 2rem; color: var(--gray);
    }
    .empty-state .icon { font-size: 3.5rem; margin-bottom: 1rem; }
    .empty-state h3 {
      font-family: 'Syne', sans-serif;
      font-size: 1.3rem; font-weight: 700;
      color: var(--dark); margin-bottom: 0.5rem;
    }
    .empty-state a {
      display: inline-block; margin-top: 1.2rem;
      background: var(--green); color: #fff;
      text-decoration: none; padding: 0.7rem 1.8rem;
      border-radius: 8px; font-family: 'Syne', sans-serif;
      font-weight: 700;
    }

    .loading { text-align: center; padding: 3rem; color: var(--gray); }

    /* EDIT MODAL */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 200; display: none;
      align-items: center; justify-content: center;
      padding: 1rem;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #fff; border-radius: 16px;
      padding: 2rem; width: 100%; max-width: 560px;
      max-height: 90vh; overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .modal-title {
      font-family: 'Syne', sans-serif;
      font-size: 1.4rem; font-weight: 800;
      margin-bottom: 1.5rem;
    }
    .form-group { margin-bottom: 1rem; }
    .form-group label {
      display: block; font-size: 0.85rem;
      font-weight: 500; margin-bottom: 0.4rem;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%; border: 1px solid var(--card-border);
      border-radius: 8px; padding: 0.6rem 0.9rem;
      font-family: 'DM Sans', sans-serif; font-size: 0.95rem;
      outline: none; background: #fafafa;
      transition: border-color 0.2s;
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus { border-color: var(--green); background: #fff; }
    .form-group textarea { resize: vertical; min-height: 70px; }
    .section-label {
      font-family: 'Syne', sans-serif; font-size: 0.78rem;
      font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--green);
      margin: 1.2rem 0 0.7rem;
    }
    .checkbox-row { display: flex; gap: 1.5rem; flex-wrap: wrap; }
    .checkbox-item {
      display: flex; align-items: center;
      gap: 0.5rem; cursor: pointer; font-size: 0.9rem;
    }
    .checkbox-item input[type="checkbox"] {
      width: 17px; height: 17px;
      accent-color: var(--green);
    }
    .modal-actions { display: flex; gap: 0.8rem; margin-top: 1.5rem; }
    .btn-save {
      flex: 1; background: var(--green); color: #fff;
      border: none; border-radius: 8px; padding: 0.75rem;
      font-family: 'Syne', sans-serif; font-size: 0.95rem;
      font-weight: 700; cursor: pointer; transition: background 0.2s;
    }
    .btn-save:hover { background: #145230; }
    .btn-cancel {
      flex: 1; background: #f5f5f5; color: var(--dark);
      border: none; border-radius: 8px; padding: 0.75rem;
      font-family: 'DM Sans', sans-serif; font-size: 0.95rem;
      cursor: pointer;
    }
    .alert {
      padding: 0.7rem 1rem; border-radius: 8px;
      font-size: 0.88rem; margin-bottom: 1rem; display: none;
    }
    .alert-success { background: #d4edda; color: #155724; display: block; }
    .alert-error { background: #f8d7da; color: #721c24; display: block; }

    footer {
      text-align: center; padding: 2rem; color: var(--gray);
      font-size: 0.85rem; margin-top: 3rem;
      border-top: 1px solid var(--card-border);
    }

    @media (max-width: 768px) {
      .nav-toggle { display: block; }
      .nav-links {
        display: none; flex-direction: column;
        position: absolute; top: 60px; left: 0; right: 0;
        background: var(--green); padding: 1rem 2rem;
        gap: 0.8rem; z-index: 99;
      }
      .nav-links.open { display: flex; }
      .nav-links a { margin-left: 0; }
      .listing-card { flex-direction: column; }
      .card-thumb { width: 100%; height: 180px; }
      .page-header { flex-direction: column; align-items: flex-start; }
      .checkbox-row { flex-direction: column; gap: 0.6rem; }
    }
    @media (max-width: 480px) {
      nav { padding: 0.8rem 1rem; }
      .page-wrap { padding: 0 1rem; }
      .card-body { padding: 1rem; }
    }
  </style>
</head>
<body>

<nav>
  <a href="/home" class="nav-logo">Rent<span>A</span>Room <span style="color:#fff;font-weight:300;font-size:1rem;">Buea</span></a>
  <button class="nav-toggle" onclick="toggleNav()">☰</button>
  <div class="nav-links" id="nav-links">
    <a href="/home">Browse</a>
    <a href="/my-listings" style="color:var(--yellow)!important">My Listings</a>
    <a href="/post-listing" class="btn-post">+ Post a Room</a>
    <a href="#" id="nav-logout">Logout</a>
  </div>
</nav>

<div class="page-wrap">
  <div class="page-header">
    <div>
      <div class="page-title">My Listings</div>
      <div class="page-subtitle" id="page-subtitle">Loading your listings...</div>
    </div>
    <a href="/post-listing" class="btn-new">+ Add New Listing</a>
  </div>

  <div id="listings-container">
    <div class="loading">Loading your listings...</div>
  </div>
</div>

<!-- EDIT MODAL -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <div class="modal-title">✏️ Edit Listing</div>
    <div class="alert" id="modal-alert"></div>

    <div class="form-group">
      <label>Title</label>
      <input type="text" id="edit-title"/>
    </div>
    <div class="form-group">
      <label>Neighbourhood</label>
      <select id="edit-neighborhood">
        <option value="Molyko">Molyko</option>
        <option value="Bonduma">Bonduma</option>
        <option value="Great Soppo">Great Soppo</option>
        <option value="Clerks Quarter">Clerks Quarter</option>
        <option value="Mile 16">Mile 16</option>
        <option value="Other">Other</option>
      </select>
    </div>
    <div class="form-group">
      <label>Room Type</label>
      <select id="edit-room_type">
        <option value="Single Room">Single Room</option>
        <option value="Room and Toilet">Room and Toilet</option>
        <option value="Self Contain">Self Contain</option>
      </select>
    </div>

    <div class="section-label">Amenities</div>
    <div class="checkbox-row">
      <label class="checkbox-item">
        <input type="checkbox" id="edit-water"/> 💧 Water Supply
      </label>
      <label class="checkbox-item">
        <input type="checkbox" id="edit-electricity"/> ⚡ Stable Electricity
      </label>
      <label class="checkbox-item">
        <input type="checkbox" id="edit-wifi"/> 📶 WiFi
      </label>
    </div>

    <div class="section-label">Pricing</div>
    <div class="form-group">
      <label>Yearly Rent (FCFA)</label>
      <input type="number" id="edit-price"/>
    </div>
    <div class="form-group">
      <label>WhatsApp Number</label>
      <input type="text" id="edit-whatsapp"/>
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea id="edit-description"></textarea>
    </div>

    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveEdit()">Save Changes</button>
    </div>
  </div>
</div>

<footer>RentARoom Buea &copy; 2025 — Built by Bake Brian-Chris Nkongho</footer>

<script>
  const API = "https://rentaroom-buea.onrender.com";
  const user = JSON.parse(localStorage.getItem("user") || "null");
  let currentEditId = null;

  // Redirect if not logged in or not landlord
  if (!user || user.role !== "landlord") {
    window.location.href = "/login";
  }

  function toggleNav() {
    document.getElementById("nav-links").classList.toggle("open");
  }

  // Setup logout
  document.getElementById("nav-logout").textContent = `Logout (${user.full_name.split(" ")[0]})`;
  document.getElementById("nav-logout").onclick = () => {
    localStorage.removeItem("user");
    window.location.href = "/login";
  };

  function getRoomEmoji(type) {
    if (type === "Single Room") return "🛏️";
    if (type === "Room and Toilet") return "🚿";
    return "🏠";
  }

  async function loadMyListings() {
    try {
      const res = await fetch(`${API}/listings/owner/${user.user_id}`);
      const listings = await res.json();
      const container = document.getElementById("listings-container");
      const subtitle = document.getElementById("page-subtitle");

      if (listings.length === 0) {
        subtitle.textContent = "You have no listings yet";
        container.innerHTML = `
          <div class="empty-state">
            <div class="icon">🏠</div>
            <h3>No listings yet</h3>
            <p>You haven't posted any rooms yet. Start by adding your first listing.</p>
            <a href="/post-listing">+ Post Your First Room</a>
          </div>`;
        return;
      }

      subtitle.textContent = `You have ${listings.length} active listing${listings.length > 1 ? "s" : ""}`;

      container.innerHTML = listings.map(l => {
        const amenities = [
          l.water ? "💧 Water" : "",
          l.electricity ? "⚡ Stable Electricity" : "",
          l.wifi ? "📶 WiFi" : ""
        ].filter(Boolean);

        const imgContent = l.image_url
          ? `<img src="${l.image_url}" alt="${l.title}"/>`
          : `<span>${getRoomEmoji(l.room_type)}</span>`;

        return `
          <div class="listing-card" id="card-${l.id}">
            <div class="card-thumb">${imgContent}</div>
            <div class="card-body">
              <div class="card-top">
                <div class="card-neighborhood">${l.neighborhood}</div>
                <div class="card-title">${l.title}</div>
                <div class="card-type">${l.room_type}</div>
                <div class="card-meta">
                  ${amenities.map(a => `<span class="amenity-tag">${a}</span>`).join("")}
                </div>
              </div>
              <div class="card-footer">
                <div class="card-price">
                  ${Number(l.price).toLocaleString()} FCFA <span>/year</span>
                </div>
                <div class="card-actions">
                  <button class="btn-edit" onclick='openEdit(${JSON.stringify(l)})'>✏️ Edit</button>
                  <button class="btn-delete" onclick="deleteListing(${l.id})">🗑️ Delete</button>
                </div>
              </div>
            </div>
          </div>`;
      }).join("");

    } catch (err) {
      document.getElementById("listings-container").innerHTML =
        `<div class="empty-state"><div class="icon">⚠️</div><p>Could not load listings. Make sure you are connected.</p></div>`;
    }
  }

  function openEdit(listing) {
    currentEditId = listing.id;
    document.getElementById("edit-title").value = listing.title;
    document.getElementById("edit-neighborhood").value = listing.neighborhood;
    document.getElementById("edit-room_type").value = listing.room_type;
    document.getElementById("edit-water").checked = listing.water;
    document.getElementById("edit-electricity").checked = listing.electricity;
    document.getElementById("edit-wifi").checked = listing.wifi;
    document.getElementById("edit-price").value = listing.price;
    document.getElementById("edit-whatsapp").value = listing.whatsapp_number || "";
    document.getElementById("edit-description").value = listing.description || "";
    document.getElementById("modal-alert").className = "alert";
    document.getElementById("modal-alert").style.display = "none";
    document.getElementById("edit-modal").classList.add("open");
  }

  function closeModal() {
    document.getElementById("edit-modal").classList.remove("open");
    currentEditId = null;
  }

  async function saveEdit() {
    const payload = {
      title: document.getElementById("edit-title").value.trim(),
      neighborhood: document.getElementById("edit-neighborhood").value,
      room_type: document.getElementById("edit-room_type").value,
      water: document.getElementById("edit-water").checked,
      electricity: document.getElementById("edit-electricity").checked,
      wifi: document.getElementById("edit-wifi").checked,
      price: Number(document.getElementById("edit-price").value),
      whatsapp_number: document.getElementById("edit-whatsapp").value.trim(),
      description: document.getElementById("edit-description").value.trim()
    };

    const res = await fetch(`${API}/listings/${currentEditId}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    const alertEl = document.getElementById("modal-alert");
    if (res.ok) {
      alertEl.textContent = "✅ Listing updated successfully!";
      alertEl.className = "alert alert-success";
      setTimeout(() => {
        closeModal();
        loadMyListings();
      }, 1200);
    } else {
      alertEl.textContent = "❌ Failed to update listing. Please try again.";
      alertEl.className = "alert alert-error";
    }
  }

  async function deleteListing(id) {
    if (!confirm("Are you sure you want to delete this listing? This cannot be undone.")) return;
    const res = await fetch(`${API}/listings/${id}`, { method: "DELETE" });
    if (res.ok) {
      document.getElementById(`card-${id}`).remove();
      const remaining = document.querySelectorAll(".listing-card").length;
      document.getElementById("page-subtitle").textContent =
        remaining === 0 ? "You have no listings yet" :
        `You have ${remaining} active listing${remaining > 1 ? "s" : ""}`;
      if (remaining === 0) loadMyListings();
    } else {
      alert("Failed to delete listing. Please try again.");
    }
  }

  // Close modal when clicking outside
  document.getElementById("edit-modal").addEventListener("click", function(e) {
    if (e.target === this) closeModal();
  });

  loadMyListings();
</script>
</body>
</html>
